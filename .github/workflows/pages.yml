name: Publicar portafolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar Django
        run: python -m pip install -r requirements.txt
      - name: Comprobar el proyecto
        run: |
          python manage.py check
          python verificar.py
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Generar el sitio desde Django
        run: python publicar.py --base-path "${{ steps.pages.outputs.base_path }}"
      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
